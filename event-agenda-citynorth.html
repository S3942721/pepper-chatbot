<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
body {
    margin: 0;
    padding: 0;
}

* {
    font-family: ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji",Segoe UI Symbol,"Noto Color Emoji"
}

div {
    box-sizing: border-box;
}

#main {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    background-color: rgb(240, 240, 240);
}

#main.idle {
    background-image: url(http://198.18.0.1/apps/rmit-race/racehub.png);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

#main.idle * {
    display: none !important;
}

div {
    box-sizing: border-box;
}

#photo {
    width: 100%;
    height: 100%;
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    background-color: rgb(240, 240, 240);
}

#photo > img {
    height: 100%;
    max-height: 100%;
    max-width: 100%;
    margin: auto;
}

#photo > img.wide {
    height: auto;
    width: 100%;
}
    </style>
    <script src="http://198.18.0.1/libs/qimessaging/2/qimessaging.js"></script>
</head>
<body>
    <div id='main' class="idle">
        <div id="photo"></div>
        <!-- <img id="photo" src="http://198.18.0.1/apps/rmit-race/racehub.png" /> -->
    </div>
</body>
<script type="text/javascript" defer>

const main = document.getElementById('main')
const photo = document.getElementById("photo")


QiSession(function(session) {
    session.service("ALMemory").then(function(ALMemory) {
        ALMemory.subscriber("PepperMessage").then(function(subscriber) {
            subscriber.signal.connect(function(value) {
                if(/acknowledge/i.test(value)) {
                    main.classList.remove('idle')
                    photo.innerHTML = "<img src='http://198.18.0.1/apps/rmit-race/acknowledge.png' class='wide' alt='Acknowledgement of Country'>"
                } else if(/Gershenfeld/i.test(value)) {
                    main.classList.remove('idle')
                    photo.innerHTML = "<img src='http://198.18.0.1/apps/rmit-race/Joel_E._Cutcher_Gershenfeld.jpeg' alt='Joel E. Cutcher Gershenfeld'>"
                } else if(/Tom/i.test(value)) {
                    main.classList.remove('idle')
                    photo.innerHTML = "<img src='http://198.18.0.1/apps/rmit-race/Tom_Bentley.jpeg' alt='Tom Bentley'>"
                } else {
                    main.classList.add('idle')
                    photo.innerHTML = "<img src='http://198.18.0.1/apps/rmit-race/racehub.png' class='wide' alt='RACE HUB'>"
                }
            });
        });
        ALMemory.subscriber("StopAction").then(function(subscriber) {
            subscriber.signal.connect(function(value) {
                main.classList.add('idle')
                photo.innerHTML = "<img src='http://198.18.0.1/apps/rmit-race/racehub.png' class='wide' alt='RACE HUB'>"
            });
        });
    }, function(error) {});
}, function() {});
</script>
</html>
